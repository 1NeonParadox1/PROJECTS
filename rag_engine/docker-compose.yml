services:
  rag-engine:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/srv/data/chroma
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  chroma_data:
