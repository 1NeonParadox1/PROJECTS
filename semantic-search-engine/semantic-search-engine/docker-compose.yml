# Optional: run a real Qdrant server instead of the default embedded/local mode.
# Start it with:  docker compose up -d
# Then run the backend with QDRANT_URL=http://localhost:6333 set in your environment
# (see backend/.env.example) so it talks to this server instead of writing to disk
# directly. This is the setup you'd describe in an interview as "production mode".

services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
